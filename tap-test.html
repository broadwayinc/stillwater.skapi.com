<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap test</title>
<style>
  body { margin: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #0b1a20; color: #f3ead8; padding: 20px 16px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #b9c6c9; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  button, a.btn { flex: 1; min-width: 130px; font: 700 16px -apple-system, system-ui, sans-serif; padding: 16px 12px; border-radius: 10px; border: 0; background: #f2b35a; color: #0b1a20; text-align: center; text-decoration: none; }
  .ghost { background: transparent; color: #f3ead8; border: 1px solid rgba(255,255,255,.3); }
  #count { font-size: 44px; font-weight: 800; text-align: center; margin: 6px 0 14px; }
  pre { background: rgba(0,0,0,.4); color: #9f9; font: 11px/1.35 ui-monospace, Menlo, monospace; padding: 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 160px; margin: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: none; }
</style>
</head>
<body>
<h1>Tap test (no game, plain HTML)</h1>
<p>Every tap on the yellow button should add 1. Then turn on the 3D load and tap again.</p>
<div id="count">0</div>
<div class="row"><button id="b1" type="button">Tap me (+1)</button><a id="a1" class="btn" href="#">Link button (+1)</a></div>
<div class="row"><button id="gl" type="button" class="ghost">Turn 3D load ON</button><button id="open" type="button" class="ghost">Open in browser</button></div>
<p id="status"></p>
<pre id="log"></pre>
<canvas id="c"></canvas>
<script>
  var n = 0, lines = [], t0 = performance.now();
  var UA = navigator.userAgent;
  function log(s) { lines.push(((performance.now() - t0) / 1000).toFixed(2) + ' ' + s); if (lines.length > 16) lines.shift(); document.getElementById('log').textContent = 'UA: ' + UA + '\n' + lines.join('\n'); }
  function bump() { n++; document.getElementById('count').textContent = n; }
  document.getElementById('b1').addEventListener('click', bump);
  document.getElementById('a1').addEventListener('click', function (e) { e.preventDefault(); bump(); });
  var types = ['pointerdown', 'pointerup', 'pointercancel', 'touchstart', 'touchend', 'touchcancel', 'click'];
  types.forEach(function (ty) { document.addEventListener(ty, function (e) { var el = e.target; log(ty + ' ' + (el.id ? '#' + el.id : el.tagName)); }); });
  // optional WebGL load: a full-screen scene redrawn every frame at device resolution, like the lake does
  var on = false, gl, raf;
  document.getElementById('gl').addEventListener('click', function () {
    on = !on; this.textContent = on ? 'Turn 3D load OFF' : 'Turn 3D load ON';
    var c = document.getElementById('c'); c.style.display = on ? 'block' : 'none';
    if (on) {
      var dpr = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * dpr; c.height = innerHeight * dpr;
      gl = gl || c.getContext('webgl', { antialias: true });
      var vs = 'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}';
      var fs = 'precision highp float;varying vec2 v;uniform float t;void main(){float s=0.;for(int i=0;i<40;i++){s+=sin(v.x*float(i)*3.+t)*cos(v.y*float(i)*2.-t);}gl_FragColor=vec4(.2+.1*s,.4+.1*sin(t),.5,1.);}';
      function sh(t, src) { var s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; }
      var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
      var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var ut = gl.getUniformLocation(pr, 't'); var last = performance.now(), avg = 16;
      gl.viewport(0, 0, c.width, c.height);
      (function draw() { if (!on) return; raf = requestAnimationFrame(draw); var now = performance.now(); avg += (now - last - avg) / 30; last = now; gl.uniform1f(ut, now / 1000); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); document.getElementById('status').textContent = '3D load on: ' + avg.toFixed(0) + ' ms/frame'; })();
    } else { cancelAnimationFrame(raf); document.getElementById('status').textContent = ''; }
  });
  var here = location.href.split('#')[0].split('?')[0];
  var bare = here.replace(/^https?:\/\//, '');
  var isAndroid = /Android/i.test(UA), isIOS = /iPhone|iPad|iPod/.test(UA);
  var openHref = isAndroid ? 'intent://' + bare + '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;S.browser_fallback_url=' + encodeURIComponent(here) + ';end' : isIOS ? 'x-safari-https://' + bare : here;
  document.getElementById('open').addEventListener('click', function () { log('open -> ' + openHref.slice(0, 40)); location.href = openHref; });
  log('ready');
</script>
</body>
</html>
